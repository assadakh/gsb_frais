{% include 'frais/v_entete.html' %}

{% include 'frais/v_sommaire.html' %}

<div class="frais-section">
    <div class="frais-section-header">
        <div class="frais-section-icon">
            <i class="fas fa-file-invoice-dollar"></i>
        </div>
        <h3>Mes fiches de frais</h3>
    </div>
</div>

<div class="card fade-in">
    <div class="card-header">
        <i class="fas fa-search me-2"></i> Sélectionner un mois
    </div>
    <div class="card-body">
        {% if les_mois %}
        <form method="get" action="{% url 'etat_frais' %}">
            <input type="hidden" name="action" value="voirEtatFrais">

            <div class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label for="lstMois" class="form-label">
                        <i class="fas fa-calendar-alt me-1"></i> Choisir un mois
                    </label>
                    <select class="form-select form-select-lg" name="lstMois" id="lstMois">
                        {% for mois_key, mois_data in les_mois.items %}
                        <option value="{{ mois_key }}"
                                {% if mois_key == mois_a_selectionner %}selected{% endif %}>
                            {{ mois_data.numMois }}/{{ mois_data.numAnnee }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-eye me-2"></i> Voir la fiche
                    </button>
                </div>
            </div>
        </form>
        {% else %}
        <div class="alert alert-warning">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Vous n'avez pas encore de fiches de frais enregistrées.
        </div>
        {% endif %}
    </div>
</div>

{% include 'frais/v_pied.html' %}
